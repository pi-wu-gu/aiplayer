# AI Player —— Access Transformer
#
# 目的：把 MC 里少数几个私有成员合法放通，替代旧 JsMacros 版 index.js 里的反射
#       （那份脚本有 23 处反射，映射一变就静默失效）。
# 放通后是**编译期可见**：映射变了会直接编译不过，而不是运行期才炸。
#
# 签名均用 javap 对 neoforge-21.1.236.jar（官方映射重编译产物）核实过：
#   private void onScroll(long, double, double)  -> (JDD)V
#   private void onMove(long, double, double)    -> (JDD)V
#   private void onPress(long, int, int, int)    -> (JIII)V
#   private double xpos; private double ypos;
#
# 注意：onPress 改坐标前必须先同步 xpos/ypos（旧脚本"坑15"记录的：
#       MouseHandler 的私有坐标不随 glfwSetCursorPos 回调更新，否则 onPress 用旧准星坐标点空）。

public net.minecraft.client.MouseHandler onScroll(JDD)V
public net.minecraft.client.MouseHandler onMove(JDD)V
public net.minecraft.client.MouseHandler onPress(JIII)V
public net.minecraft.client.MouseHandler xpos
public net.minecraft.client.MouseHandler ypos

# ---- UI 感知：动作栏文本 + 容器界面当前悬停槽 ----
# 动作栏（overlay）：很多模组的提示走这里而不是聊天栏（旧 index.js 的 overlay 动作就是读这两个字段）
public net.minecraft.client.gui.Gui overlayMessageString
public net.minecraft.client.gui.Gui overlayMessageTime
# 悬停槽：用来校验"槽位 screen 坐标"算得对不对（留待容器交互用）
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen hoveredSlot
